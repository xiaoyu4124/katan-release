name: release-530
on:
  push:
    paths:
      - '.github/workflows/rel-530.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify APK
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/KaTan_5.30.apk "https://aka.doubaocdn.com/s/q0hVtVPLge"
          echo "902495eef69b4b9ce30eec9fb2902ef0ced196e2230554d13444b94cd7b6421e  /tmp/KaTan_5.30.apk" | sha256sum -c -
          mkdir -p apk
          cp /tmp/KaTan_5.30.apk apk/KaTan_5.30.apk
      - name: Write release notes
        run: |
          cat > /tmp/notes.md <<'MD'
          卡探 5.30（音频控制补齐）

          · 新增底部播放条：暂停 / 继续 / 停止 / 进度拖动，显示“当前 / 总时长”
          · 播放完成自动收起播放条
          · 新增通知栏媒体控制：暂停·继续 / 停止，可拖拽系统媒体进度
          · 接入 MediaSession，锁屏与下拉快捷面板可控制
          · 切到后台仍可播放与暂停；退出应用时释放播放器与通知
          MD
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v5.30 apk/KaTan_5.30.apk --title "卡探 5.30" --notes-file /tmp/notes.md --latest
      - name: Update update.json
        run: |
          cat > update.json <<'JSON'
          {
            "versionCode": 83,
            "versionName": "5.30",
            "url": "https://raw.githubusercontent.com/xiaoyu4124/katan-release/main/apk/KaTan_5.30.apk",
            "urls": [
              "https://aka.doubaocdn.com/s/q0hVtVPLge",
              "https://cdn.jsdelivr.net/gh/xiaoyu4124/katan-release@main/apk/KaTan_5.30.apk",
              "https://github.com/xiaoyu4124/katan-release/releases/download/v5.30/KaTan_5.30.apk",
              "https://ghfast.top/https://raw.githubusercontent.com/xiaoyu4124/katan-release/main/apk/KaTan_5.30.apk",
              "https://gitee.com/yu1481726037/katan-release/raw/master/apk/KaTan_5.30.apk"
            ],
            "force": false,
            "notes": "卡探 5.30\n\n· 底部播放条：暂停/继续/停止/进度拖动\n· 通知栏与锁屏媒体控制（MediaSession）\n· 后台仍可控，退出时释放播放器和通知"
          }
          JSON
      - name: Commit artifacts
        run: |
          set -euo pipefail
          git config user.name "katan-bot"
          git config user.email "bot@users.noreply.github.com"
          git add apk/KaTan_5.30.apk update.json
          git commit -m "release: 5.30 (v83)" || echo "nothing to commit"
          git push
