name: mirror-apk

# 只做一件事：把某个版本的 APK 从 CDN 拉下来、校验 SHA-256、提交到 apk/ 目录。
# update.json 不在这里改，避免镜像文件名与 versionCode 错配。
# 新版本发完后手动跑：Actions -> mirror-apk -> Run workflow，填 apk_url / apk_name / apk_sha256

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK 下载地址（CDN 直链）'
        required: true
      apk_name:
        description: '保存文件名，例如 KaTan_5.49.apk'
        required: true
      apk_sha256:
        description: '期望 SHA-256'
        required: true

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download + verify
        id: dl
        run: |
          URL="${{ inputs.apk_url }}"
          NAME="${{ inputs.apk_name }}"
          SHA="${{ inputs.apk_sha256 }}"
          if [ -z "$URL" ] || [ -z "$NAME" ] || [ -z "$SHA" ]; then
            echo '缺少 apk_url / apk_name / apk_sha256'
            exit 1
          fi
          echo "url=$URL"
          echo "name=$NAME"
          mkdir -p apk
          curl -fL --retry 3 --retry-delay 2 -o "apk/$NAME" "$URL"
          echo "$SHA  apk/$NAME" | sha256sum -c -
          echo "NAME=$NAME" >> $GITHUB_OUTPUT
          echo "SHA=$SHA" >> $GITHUB_OUTPUT
          echo "SIZE=$(stat -c %s "apk/$NAME")" >> $GITHUB_OUTPUT

      - name: Commit into apk/
        run: |
          NAME="${{ steps.dl.outputs.NAME }}"
          SHA="${{ steps.dl.outputs.SHA }}"
          SIZE="${{ steps.dl.outputs.SIZE }}"
          git config user.name 'katan-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add "apk/$NAME"
          if git diff --cached --quiet; then
            echo "apk/$NAME 内容未变，无需提交"
            exit 0
          fi
          git commit -m "mirror: $NAME" -m "sha256: $SHA" -m "size: $SIZE"
          git push
