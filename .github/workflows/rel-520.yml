name: rel-520

on:
  push:
    paths:
      - ".github/workflows/rel-520.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch assets
        run: |
          curl -fsSL -o KaTan_5.20.apk "https://aka.doubaocdn.com/s/rUtvXJII6I"
          curl -fsSL -o KaTan-5.20-source.zip "https://aka.doubaocdn.com/s/WNRNYtsSfI"
          echo "22614ddf11b1da66aa8564c0cea58692be36fae34f7dfdd15ed88eac1a4baf1e  KaTan_5.20.apk" | sha256sum -c
          echo "36680c4bc5d50990a6915d4fccd42189dbb41a265ad123d40ad563b15e1b7162  KaTan-5.20-source.zip" | sha256sum -c
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v5.20 KaTan_5.20.apk KaTan-5.20-source.zip --title "卡探 5.20 · 国内加速镜像" --latest --notes-file <(printf '卡探 5.20\n\n· 新增 ghfast.top 匿名加速源，无需令牌、无需 Gitee 设置\n· 源顺序：Gitee -> ghfast 加速 -> GitHub raw -> jsDelivr\n· 单源 6 秒超时自动换下一个\n\n校验值：\n22614ddf11b1da66aa8564c0cea58692be36fae34f7dfdd15ed88eac1a4baf1e  KaTan_5.20.apk\n36680c4bc5d50990a6915d4fccd42189dbb41a265ad123d40ad563b15e1b7162  卡探-5.20-源码.zip\n')
      - name: Commit apk and feed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          mkdir -p apk
          cp KaTan_5.20.apk apk/KaTan_5.20.apk
          cat > update.json <<'JSON'
          {
            "versionCode": 73,
            "versionName": "5.20",
            "url": "https://ghfast.top/https://github.com/xiaoyu4124/katan-release/releases/download/v5.20/KaTan_5.20.apk",
            "urls": [
              "https://ghfast.top/https://raw.githubusercontent.com/xiaoyu4124/katan-release/main/apk/KaTan_5.20.apk",
              "https://cdn.jsdelivr.net/gh/xiaoyu4124/katan-release@main/apk/KaTan_5.20.apk",
              "https://github.com/xiaoyu4124/katan-release/releases/download/v5.20/KaTan_5.20.apk",
              "https://gitee.com/yu1481726037/katan-release/raw/master/apk/KaTan_5.20.apk"
            ],
            "force": false,
            "notes": "卡探 5.20\n\n· 新增 ghfast.top 加速镜像（国内直连、无需令牌）\n· 检查更新多源自动切换，单源 6 秒超时\n· APK 下载多镜像依次重试"
          }
          JSON
          python3 -m json.tool update.json > /dev/null
          git add apk/KaTan_5.20.apk update.json
          git commit -m "release: 5.20 apk + feed v73"
          git push
