name: release-533
on:
  push:
    paths:
      - '.github/workflows/rel-533.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify APK
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/KaTan_5.33.apk "https://aka.doubaocdn.com/s/BXSM7gV92D"
          echo "c12df2a887cefa06c719b8b975a17690cfaa00c014a5055cbb5dc0207335089a  /tmp/KaTan_5.33.apk" | sha256sum -c -
          mkdir -p apk
          cp /tmp/KaTan_5.33.apk apk/KaTan_5.33.apk
      - name: Write release notes
        run: |
          cat > /tmp/notes.md <<'MD'
          卡探 5.33（OTG USB 层自检）

          针对“CBW 发送失败”

          · CBW 发送失败时先发 CLEAR_FEATURE(ENDPOINT_HALT)，再重试一次，不再一失败就放弃
          · 打开设备时先 setInterface 再清两个端点的 halt，避免上一轮失败遗留的端口卡死状态
          · 数据阶段 / CSW 阶段失败后也清 halt，保证下一次点击不会连着失败
          · 新增 USB 自检报告：设备五元信息、两个端点地址与包大小、清 halt 结果、TEST UNIT READY、INQUIRY 厂商与型号、READ CAPACITY 末块与块大小、读 LBA0 前 8 字节
          · 自检结果同时写日志，并显示在 OTG 面板的提示区
          MD
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v5.33 apk/KaTan_5.33.apk --title "卡探 5.33" --notes-file /tmp/notes.md --latest
      - name: Update update.json
        run: |
          cat > update.json <<'JSON'
          {
            "versionCode": 86,
            "versionName": "5.33",
            "url": "https://raw.githubusercontent.com/xiaoyu4124/katan-release/main/apk/KaTan_5.33.apk",
            "urls": [
              "https://aka.doubaocdn.com/s/BXSM7gV92D",
              "https://cdn.jsdelivr.net/gh/xiaoyu4124/katan-release@main/apk/KaTan_5.33.apk",
              "https://github.com/xiaoyu4124/katan-release/releases/download/v5.33/KaTan_5.33.apk",
              "https://ghfast.top/https://raw.githubusercontent.com/xiaoyu4124/katan-release/main/apk/KaTan_5.33.apk",
              "https://gitee.com/yu1481726037/katan-release/raw/master/apk/KaTan_5.33.apk"
            ],
            "force": false,
            "notes": "卡探 5.33\n\n· USB 失败自动清 halt 并重试（修“CBW 发送失败”）\n· 新增 USB 自检：端点/TUR/INQUIRY/容量/LBA0\n"
          }
          JSON
      - name: Commit artifacts
        run: |
          set -euo pipefail
          git config user.name "katan-bot"
          git config user.email "bot@users.noreply.github.com"
          git add apk/KaTan_5.33.apk update.json
          git commit -m "release: 5.33 (v86)" || echo "nothing to commit"
          git push
