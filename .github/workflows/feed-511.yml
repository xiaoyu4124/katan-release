name: feed-511
on:
  push:
    paths:
      - .github/workflows/feed-511.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch apk and verify sha256
        run: |
          curl -sSL --retry 3 -o KaTan_5.11.apk "https://aka.doubaocdn.com/s/DI0J2T4Q0q"
          echo "8921d03fc547d15291a8fe0d215d8bc62094cc56184aee9adff9ab3e9a36caf8  KaTan_5.11.apk" | sha256sum -c -
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v5.11 KaTan_5.11.apk --title "卡探 5.11" --notes "新增安全柜（Android/data/com.cardprobe/files/vault），普通管理器进不来。"
      - name: Rewrite update.json to 5.11
        run: |
          curl -sSL --retry 3 -o feed.zip "https://aka.doubaocdn.com/s/Xm1dvongWr"
          unzip -o feed.zip -d feed
          python3 feed/patch_feed.py
          git config user.name "katan-bot"
          git config user.email "katan-bot@users.noreply.github.com"
          git add update.json
          git commit -m "feed: 指向 5.11（v64）"
          git push
