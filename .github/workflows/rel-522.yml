name: rel-522

on:
  push:
    paths:
      - ".github/workflows/rel-522.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch assets
        run: |
          curl -fsSL -o KaTan_5.22.apk "https://aka.doubaocdn.com/s/JN4RAtEZPP"
          curl -fsSL -o KaTan-5.22-source.zip "https://aka.doubaocdn.com/s/ahusYUiaO9"
          echo "2993a137112bc7fa392473d0e39200569f9be8a32e9b5f90c775baea79dd5c49  KaTan_5.22.apk" | sha256sum -c
          echo "0c3db0c1fe9273e69778fe277397dc6570adce5090b53e1e5cf753e6bf5b1fed  KaTan-5.22-source.zip" | sha256sum -c
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v5.22 KaTan_5.22.apk KaTan-5.22-source.zip --title "卡探 5.22 · MT 风格弹窗" --latest --notes-file <(printf '卡探 5.22\n\n· 更新弹窗 / 下载失败弹窗改成 MT 管理器那种底部卡片风格\n· 顶部灰色提示 + 右上 ✕，下面是标题、副标题、正文\n· 底部两列带图标的选项行，中间细分隔线，深色圆角上边角\n\n校验值：\n2993a137112bc7fa392473d0e39200569f9be8a32e9b5f90c775baea79dd5c49  KaTan_5.22.apk\n0c3db0c1fe9273e69778fe277397dc6570adce5090b53e1e5cf753e6bf5b1fed  卡探-5.22-源码.zip\n')
      - name: Commit apk and feed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          mkdir -p apk
          cp KaTan_5.22.apk apk/KaTan_5.22.apk
          cat > update.json <<'JSON'
          {
            "versionCode": 75,
            "versionName": "5.22",
            "url": "https://raw.githubusercontent.com/xiaoyu4124/katan-release/main/apk/KaTan_5.22.apk",
            "urls": [
              "https://aka.doubaocdn.com/s/JN4RAtEZPP",
              "https://cdn.jsdelivr.net/gh/xiaoyu4124/katan-release@main/apk/KaTan_5.22.apk",
              "https://github.com/xiaoyu4124/katan-release/releases/download/v5.22/KaTan_5.22.apk",
              "https://ghfast.top/https://raw.githubusercontent.com/xiaoyu4124/katan-release/main/apk/KaTan_5.22.apk",
              "https://gitee.com/yu1481726037/katan-release/raw/master/apk/KaTan_5.22.apk"
            ],
            "force": false,
            "notes": "卡探 5.22\n\n· 更新弹窗改成 MT 那种底部卡片：顶部提示 + 右上关闭，下面标题与版本信息\n· 底部两列图标选项，主操作带蓝点\n· 下载失败也同样是卡片，逐源列出 ✗ 原因，可一键浏览器下载"
          }
          JSON
          python3 -m json.tool update.json > /dev/null
          git add apk/KaTan_5.22.apk update.json
          git commit -m "release: 5.22 apk + feed v75"
          git push
