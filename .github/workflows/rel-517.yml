name: rel-517

on:
  push:
    paths:
      - ".github/workflows/rel-517.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch assets
        run: |
          curl -fsSL -o KaTan_5.17.apk "https://aka.doubaocdn.com/s/ADIvmIELqU"
          curl -fsSL -o KaTan-5.17-source.zip "https://aka.doubaocdn.com/s/PkVpNut5k7"
          echo "e20c0fffd31c557bdeae116e1a30d1355062388aba8ac164bf9124954ee06642  KaTan_5.17.apk" | sha256sum -c
          echo "4fe49492d45d5005f1d9b6060a9196ff25f0afcfaf040a45ae0a4011ded22c6e  KaTan-5.17-source.zip" | sha256sum -c
          mkdir -p apk
          cp KaTan_5.17.apk apk/KaTan_5.17.apk
      - name: Commit apk for jsDelivr
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add apk/KaTan_5.17.apk
          git commit -m "repo: 5.17 APK for jsDelivr"
          git push
      - name: Publish release and feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/notes.md <<'EOF'
          卡探 5.17 · 更新源多源自动切换（治 GitHub 超时）

          · 检查更新依次尝试 Gitee → jsDelivr → GitHub 三个源，谁先通用谁，并记住上次成功的源
          · APK 下载同样多镜像依次重试：直连 jsDelivr CDN，不再死磕 github.com 下载域名
          · 每个源 6 秒连接超时，失败立刻换下一个，不再卡在“正在检查更新”上
          · 本版 APK 同时放进仓库 apk/ 目录，jsDelivr 可直接分发

          jsDelivr 直链：
          https://cdn.jsdelivr.net/gh/xiaoyu4124/katan-release@main/apk/KaTan_5.17.apk

          校验值：
          e20c0fffd31c557bdeae116e1a30d1355062388aba8ac164bf9124954ee06642  KaTan_5.17.apk (156436 B)
          4fe49492d45d5005f1d9b6060a9196ff25f0afcfaf040a45ae0a4011ded22c6e  卡探-5.17-源码.zip
          EOF
          gh release create v5.17 KaTan_5.17.apk KaTan-5.17-source.zip --title "卡探 5.17 · 多源更新（治超时）" --latest --notes-file /tmp/notes.md
          cat > update.json <<'JSON'
          {
            "versionCode": 70,
            "versionName": "5.17",
            "url": "https://cdn.jsdelivr.net/gh/xiaoyu4124/katan-release@main/apk/KaTan_5.17.apk",
            "urls": [
              "https://gitee.com/xiaoyu4124/katan-release/raw/master/apk/KaTan_5.17.apk",
              "https://github.com/xiaoyu4124/katan-release/releases/download/v5.17/KaTan_5.17.apk"
            ],
            "force": false,
            "notes": "卡探 5.17\n\n· 更新检查与下载均多源自动切换（Gitee / jsDelivr / GitHub）\n· 单源 6 秒超时即换源，不再长时间卡住"
          }
          JSON
          python3 -m json.tool update.json > /dev/null
          git add update.json
          git commit -m "feed: v70 / 5.17"
          git push
