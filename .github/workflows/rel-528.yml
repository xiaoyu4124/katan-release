name: release-528
on:
  push:
    paths:
      - '.github/workflows/rel-528.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify APK
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/KaTan_5.28.apk "https://aka.doubaocdn.com/s/IsRg5blWfj"
          echo "19728ff8c704a1016cc42ef8db4bb17c1ff0bf748dd56fa4fb0e4dba67c09fd0  /tmp/KaTan_5.28.apk" | sha256sum -c -
          mkdir -p apk
          cp /tmp/KaTan_5.28.apk apk/KaTan_5.28.apk
      - name: Write release notes
        run: |
          cat > /tmp/notes.md <<'MD'
          卡探 5.28（第三批缺陷修复）

          · ContentProvider 路径前缀改为必须 /f/，不再接受 /foo 类松散路径（D8）
          · 日志面板改为后台读取 + 只读文件尾部 96KB，主线程不再阻塞（D9）
          · 日志展示超长时折叠尾部 6 万字，完整内容走导出
          · 导出日志改到后台线程完成后再提示（D9）
          · 扫描结果上限 8000 条，超出只记录一次截断并在完成提示里说明（D10）
          MD
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v5.28 apk/KaTan_5.28.apk --title "卡探 5.28" --notes-file /tmp/notes.md --latest
      - name: Update update.json
        run: |
          cat > update.json <<'JSON'
          {
            "versionCode": 81,
            "versionName": "5.28",
            "url": "https://raw.githubusercontent.com/xiaoyu4124/katan-release/main/apk/KaTan_5.28.apk",
            "urls": [
              "https://aka.doubaocdn.com/s/IsRg5blWfj",
              "https://cdn.jsdelivr.net/gh/xiaoyu4124/katan-release@main/apk/KaTan_5.28.apk",
              "https://github.com/xiaoyu4124/katan-release/releases/download/v5.28/KaTan_5.28.apk",
              "https://ghfast.top/https://raw.githubusercontent.com/xiaoyu4124/katan-release/main/apk/KaTan_5.28.apk",
              "https://gitee.com/yu1481726037/katan-release/raw/master/apk/KaTan_5.28.apk"
            ],
            "force": false,
            "notes": "卡探 5.28\n\n· Provider 路径前缀改为 /f/（D8）\n· 日志面板后台读 + 只读尾部 96KB（D9）\n· 导出日志改后台线程（D9）\n· 扫描结果上限 8000 条（D10）"
          }
          JSON
      - name: Commit artifacts
        run: |
          set -euo pipefail
          git config user.name "katan-bot"
          git config user.email "bot@users.noreply.github.com"
          git add apk/KaTan_5.28.apk update.json
          git commit -m "release: 5.28 (v81)" || echo "nothing to commit"
          git push
