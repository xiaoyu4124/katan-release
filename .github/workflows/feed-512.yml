name: feed-512

on:
  push:
    paths:
      - ".github/workflows/feed-512.yml"

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch apk
        run: |
          curl -fsSL -o KaTan_5.12.apk "https://aka.doubaocdn.com/s/xzoy5Ek2sN"
          echo "9756ea4ab5503b833bc402a42eee055373f3cc651913b262276fa5053628670e  KaTan_5.12.apk" | sha256sum -c
          ls -l KaTan_5.12.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/notes.md <<'EOF'
          卡探 5.12

          · 新增「隐藏区」入口：长按空白处 / ⋮ 菜单，进卡探测尾点目录，命中直接进入
          · 没预置的卡可一键把 tf_hide.py 下到 Download/，插读卡器到电脑跑一次 deploy
          · 配套工具仓 https://github.com/xiaoyu4124/tf-hide
          EOF
          gh release create v5.12 KaTan_5.12.apk --title "卡探 5.12" --notes-file /tmp/notes.md
      - name: Update feed
        run: |
          python3 - <<'EOF'
          import json
          data = {
            "versionCode": 65,
            "versionName": "5.12",
            "url": "https://github.com/xiaoyu4124/katan-release/releases/download/v5.12/KaTan_5.12.apk",
            "force": False,
            "notes": "卡探 5.12\n\n· 新增「隐藏区」入口：长按空白处 / ⋮ 菜单，进卡探测尾点目录，命中直接进入\n· 没预置的卡可一键把 tf_hide.py 下到 Download/，插读卡器到电脑跑一次 deploy\n· 配套工具仓 https://github.com/xiaoyu4124/tf-hide"
          }
          open('update.json', 'w', encoding='utf-8').write(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          EOF
          git config user.name "xiaoyu4124"
          git config user.email "xiaoyu4124@users.noreply.github.com"
          git add update.json round.json 2>/dev/null || git add update.json
          git commit -m "feed: 5.12"
          git push
