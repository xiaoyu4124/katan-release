name: prerelease-513

on:
  push:
    paths:
      - ".github/workflows/prerelease-513.yml"

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch assets
        run: |
          curl -fsSL -o KaTan_5.13.apk "https://aka.doubaocdn.com/s/2we89br6dz"
          curl -fsSL -o KaTan-5.13-source.zip "https://aka.doubaocdn.com/s/Vd2giHVFTv"
          echo "7ea02ac11ea2f9a461a30dc493b56a5ed2dd1e1b12a29548ece52e547cb51501  KaTan_5.13.apk" | sha256sum -c
          echo "7148b1c2ed3016e15b1fbb0d7e5d0bda8bb5f69121e8da6246321d8675373ddb  KaTan-5.13-source.zip" | sha256sum -c
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/notes.md <<'EOF'
          卡探 5.13（测试版，别拿正式卡试）

          新增「OTG 裸写」：手机插 OTG 读卡器，App 直接走 USB 大容量存储协议裸写扇区，绕开安卓 FUSE，不需要 root。

          用法：长按空白处 →「OTG 裸写：在卡上生成隐藏区」
          1. 设置 → 存储 里把这块 U 盘「弹出」
          2. 先点「只读探测」，确认 UUID / 簇大小 / 各层是否存在
          3. 再点「写入生成」，自动建 RECYCLER88/尾点目录/$$$/com8.{…}/su-heng/local/4124
          4. 拔插一次，卡放回手机，点「打开隐藏区」

          安全机制：写入前把每个被改扇区记到 Download/otg_journal_*.bin，可回滚；系统还挂着卷时拒绝写入。

          校验值：
          7ea02ac11ea2f9a461a30dc493b56a5ed2dd1e1b12a29548ece52e547cb51501  KaTan_5.13.apk (156436 B)
          7148b1c2ed3016e15b1fbb0d7e5d0bda8bb5f69121e8da6246321d8675373ddb  卡探-5.13-源码.zip (132019 B)

          说明：update.json 仍指向 5.12，「检查更新」不会自动升到这一版。
          EOF
          gh release create v5.13 KaTan_5.13.apk KaTan-5.13-source.zip --title "卡探 5.13 测试版 · OTG 裸写" --prerelease --notes-file /tmp/notes.md
