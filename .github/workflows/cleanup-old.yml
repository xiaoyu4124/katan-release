name: cleanup-old

on:
  push:
    paths:
      - ".github/workflows/cleanup-old.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete outdated prereleases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          for tag in v5.13 v5.11 v5.10 v5.9 v5.8; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || echo "skip $tag"
          done
          gh release list --repo "$GITHUB_REPOSITORY"
