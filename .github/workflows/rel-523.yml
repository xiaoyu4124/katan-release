name: rel-523

on:
  push:
    paths:
      - ".github/workflows/rel-523.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch assets
        run: |
          curl -fsSL -o KaTan_5.23.apk "https://aka.doubaocdn.com/s/w6DKyonsAK"
          curl -fsSL -o KaTan-5.23-source.zip "https://aka.doubaocdn.com/s/AzkBO2sMKl"
          echo "194fa9d241c54618a99121247f16697f9e88b5785c3d7aa622bb265b3f4ed254  KaTan_5.23.apk" | sha256sum -c
          echo "6646a8f9de88816a79614f2a3aaadc327af88be3f4ecd261c7c47d5cd9889add  KaTan-5.23-source.zip" | sha256sum -c
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v5.23 KaTan_5.23.apk KaTan-5.23-source.zip --title "卡探 5.23 · 三个闭环修复" --latest --notes-file <(printf '卡探 5.23\n\n· 修复：单个大文件复制时取消无效（旧逻辑会无视取消指令把包完整拷完）\n· 修复：扫描无手动停止入口（现在 ⋮ 菜单扫描中会出现「停止扫描（进行中）」）\n· 修复：OTG 向导弹窗关闭后仍每 1.5s 轮询 USB（现在关闭即停止）\n\n校验值：\n194fa9d241c54618a99121247f16697f9e88b5785c3d7aa622bb265b3f4ed254  KaTan_5.23.apk\n6646a8f9de88816a79614f2a3aaadc327af88be3f4ecd261c7c47d5cd9889add  卡探-5.23-源码.zip\n')
      - name: Commit apk and feed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          mkdir -p apk
          cp KaTan_5.23.apk apk/KaTan_5.23.apk
          cat > update.json <<'JSON'
          {
            "versionCode": 76,
            "versionName": "5.23",
            "url": "https://raw.githubusercontent.com/xiaoyu4124/katan-release/main/apk/KaTan_5.23.apk",
            "urls": [
              "https://aka.doubaocdn.com/s/w6DKyonsAK",
              "https://cdn.jsdelivr.net/gh/xiaoyu4124/katan-release@main/apk/KaTan_5.23.apk",
              "https://github.com/xiaoyu4124/katan-release/releases/download/v5.23/KaTan_5.23.apk",
              "https://ghfast.top/https://raw.githubusercontent.com/xiaoyu4124/katan-release/main/apk/KaTan_5.23.apk",
              "https://gitee.com/yu1481726037/katan-release/raw/master/apk/KaTan_5.23.apk"
            ],
            "force": false,
            "notes": "卡探 5.23\n\n· 大文件复制可取消：中断后不再留半截文件\n· 扫描可手动停止：⋮ 菜单在扫描中出现「停止扫描（进行中）」\n· OTG 向导弹窗关闭后不再后台轮询 USB"
          }
          JSON
          python3 -m json.tool update.json > /dev/null
          git add apk/KaTan_5.23.apk update.json
          git commit -m "release: 5.23 apk + feed v76"
          git push
