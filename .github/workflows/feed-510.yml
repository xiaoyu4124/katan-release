name: feed-510
on:
  push:
    paths:
      - .github/workflows/feed-510.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch apk and verify sha256
        run: |
          curl -sSL --retry 3 -o KaTan_5.10.apk "https://aka.doubaocdn.com/s/hVUEcQs5BB"
          echo "1194a0f7bdbe5ea463030d7866fb6b86a34e9a2d967200acf83ce41791cca89d  KaTan_5.10.apk" | sha256sum -c -
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v5.10 KaTan_5.10.apk --title "卡探 5.10" --notes "更新前先查本地：已有同版本安装包就直接装，不再重复下载。"
      - name: Rewrite update.json to 5.10
        run: |
          curl -sSL --retry 3 -o feed.zip "https://aka.doubaocdn.com/s/WHGmzAnXfh"
          unzip -o feed.zip -d feed
          python3 feed/patch_feed.py
          git config user.name "katan-bot"
          git config user.email "katan-bot@users.noreply.github.com"
          git add update.json
          git commit -m "feed: 指向 5.10（v63）"
          git push
