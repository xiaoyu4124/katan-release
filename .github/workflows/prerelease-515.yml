name: prerelease-515

on:
  push:
    paths:
      - ".github/workflows/prerelease-515.yml"

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch assets
        run: |
          curl -fsSL -o KaTan_5.15.apk "https://aka.doubaocdn.com/s/hh2tLs4JoV"
          curl -fsSL -o KaTan-5.15-source.zip "https://aka.doubaocdn.com/s/gYFdQbJeOJ"
          echo "ba374f7d84f27caf930c8538b75a8efdfe3670a4ec855d2e02f9bb0272101fde  KaTan_5.15.apk" | sha256sum -c
          echo "46aac3dc0d45284b9c84ddc31eaaf9a0393deb9d8c6e99980045f9b45b0109c2  KaTan-5.15-source.zip" | sha256sum -c
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/notes.md <<'EOF'
          卡探 5.15 测试版 · 删掉假隐藏入口

          移除四项无效功能（普通管理器一看就穿）：
          · 打开隐藏区（需电脑预置、手机端看不到壳）
          · 打开安全柜（Android/data 只是被系统拦一层）
          · 新建藏匿目录（伪装路径，内容照样可见）
          · 新建隐藏文件夹（. 开头，仅藏住媒体扫描）

          对应入口全部删除：长按空白菜单 4 项、⋮ 菜单的「安全柜」「隐藏区」两项；
          相关代码（伪装目录模板、安全柜目录、隐藏区探测/脚本下载）一并删除，APK 反而小了 4 KB。

          保留：新建文件/文件夹（含 . 隐藏勾选）、OTG 裸写四步向导——这是目前唯一真隐藏的路。

          校验值：
          ba374f7d84f27caf930c8538b75a8efdfe3670a4ec855d2e02f9bb0272101fde  KaTan_5.15.apk (156436 B)
          46aac3dc0d45284b9c84ddc31eaaf9a0393deb9d8c6e99980045f9b45b0109c2  卡探-5.15-源码.zip

          update.json 仍指向 5.12，不会自动推送。
          EOF
          gh release create v5.15 KaTan_5.15.apk KaTan-5.15-source.zip --title "卡探 5.15 测试版 · 删掉假隐藏入口" --prerelease --notes-file /tmp/notes.md
