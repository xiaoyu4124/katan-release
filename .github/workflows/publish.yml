name: publish
on:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch apk and verify sha256
        run: |
          curl -sSL -o KaTan_5.8.apk "https://aka.doubaocdn.com/s/YjbEeG1mg6"
          echo "e98fda79eb4d2a4477679602cf8046f4c7f402adfa6b36135ce5013147b50ca2  KaTan_5.8.apk" | sha256sum -c -
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v5.8 KaTan_5.8.apk --title "卡探 5.8" --notes "公开更新源首发。应用内 ⋮ →「检查更新」或启动自动检查即可拉取。"
