name: mirror-to-gitee

# GitHub 是唯一的源，推完自动同步到 Gitee。
# 前提：在 GitHub 仓库 Settings -> Secrets -> Actions 里加一个 GITEE_TOKEN（Gitee 私人令牌，勾 projects）。
# 没加 token 时这个工作流会直接跳过，不会报红。
# Gitee 仓默认分支是 master，App 里拼的就是 raw/master/update.json，对得上。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-to-gitee
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check GITEE_TOKEN
        id: chk
        run: |
          if [ -z "${{ secrets.GITEE_TOKEN }}" ]; then
            echo '没有 GITEE_TOKEN，本次跳过同步'
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.chk.outputs.skip == 'false'
        with:
          fetch-depth: 0

      - name: Verify Gitee token
        if: steps.chk.outputs.skip == 'false'
        env:
          TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "https://gitee.com/api/v5/user?access_token=$TOKEN")
          echo "Gitee token 自检 HTTP=$code"
          if [ "$code" != "200" ]; then
            echo '::error::GITEE_TOKEN 无效或 topical 权限不足（访问 api/v5/user 未返回 200）'
            exit 1
          fi

      - name: Push to Gitee
        if: steps.chk.outputs.skip == 'false'
        env:
          TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git config user.name 'katan-bot'
          git config user.email 'bot@users.noreply.github.com'
          git remote add gitee "https://yu1481726037:${TOKEN}@gitee.com/yu1481726037/katan-release.git"
          GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/bin/true git push --force gitee HEAD:master
          echo '已同步到 gitee.com/yu1481726037/katan-release (master)'
