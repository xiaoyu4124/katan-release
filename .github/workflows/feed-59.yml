name: feed-59
on:
  push:
    paths:
      - .github/workflows/feed-59.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch apk and verify sha256
        run: |
          curl -sSL -o KaTan_5.9.apk "https://aka.doubaocdn.com/s/D9Qr2dJ09W"
          echo "8dad841c3f78826489cbab63f92a3c6a3bf4b306bd7ccb0b1caf881e77f3839f  KaTan_5.9.apk" | sha256sum -c -
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v5.9 KaTan_5.9.apk --title "卡探 5.9" --notes "修复空白处长按无反应（手指抖动误取消）。应用内检查更新即可升级。"
      - name: Rewrite update.json to 5.9
        run: |
          curl -sSL -o feed.zip "https://aka.doubaocdn.com/s/iJ4CBEdEbv"
          unzip -o feed.zip -d feed
          python3 feed/patch_feed.py
          git config user.name "katan-bot"
          git config user.email "katan-bot@users.noreply.github.com"
          git add update.json
          git commit -m "feed: 指向 5.9（v62）"
          git push
