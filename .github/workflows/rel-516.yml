name: rel-516

on:
  push:
    paths:
      - ".github/workflows/rel-516.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch assets
        run: |
          curl -fsSL -o KaTan_5.16.apk "https://aka.doubaocdn.com/s/MLy04Sl63L"
          curl -fsSL -o KaTan-5.16-source.zip "https://aka.doubaocdn.com/s/QJFLoU6Ozk"
          echo "44d72415a68be3d997361519ef8921f312cd27b93579717802e54ad85db520fa  KaTan_5.16.apk" | sha256sum -c
          echo "18befcaf4f32fe68ecc331525c7d38bf27d7c0ed3eead2057281aa4f4ceb62db  KaTan-5.16-source.zip" | sha256sum -c
      - name: Publish release and bump feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/notes.md <<'EOF'
          卡探 5.16 · 复制移动改成 MT 那样一点就到位

          · 长按文件的菜单里「复制 ->」「移动 ->」带蓝点：单击直接把文件传到对侧窗口，不再要求先点粘贴
          · 同一个「复制 ->」长按 = 放进剪贴板，走原来的单窗口粘贴流程（带点的菜单都支持长按）
          · 菜单顶部加了蓝字提示：带 · 的菜单单击到对侧、长按放剪贴板
          · 传入时 toast 会显示 文件 → B 窗口：目标路径；完成后再报 成功/跳过/失败
          · 目标已存在同名文件时仍弹 覆盖/跳过/自动改名 三选一

          校验值：
          44d72415a68be3d997361519ef8921f312cd27b93579717802e54ad85db520fa  KaTan_5.16.apk (156436 B)
          18befcaf4f32fe68ecc331525c7d38bf27d7c0ed3eead2057281aa4f4ceb62db  卡探-5.16-源码.zip
          EOF
          gh release create v5.16 KaTan_5.16.apk KaTan-5.16-source.zip --title "卡探 5.16 · 一点直达对侧窗口" --latest --notes-file /tmp/notes.md
          cat > update.json <<'JSON'
          {
            "versionCode": 69,
            "versionName": "5.16",
            "url": "https://github.com/xiaoyu4124/katan-release/releases/download/v5.16/KaTan_5.16.apk",
            "force": false,
            "notes": "卡探 5.16\n\n· 复制/移动「一点直达对侧窗口」，长按放剪贴板\n· 带 · 的菜单支持长按单窗口操作\n· 传入/完成均有提示"
          }
          JSON
          python3 -m json.tool update.json > /dev/null
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add update.json
          git commit -m "feed: v69 / 5.16"
          git push
