name: rel-521

on:
  push:
    paths:
      - ".github/workflows/rel-521.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch assets
        run: |
          curl -fsSL -o KaTan_5.21.apk "https://aka.doubaocdn.com/s/G5fDY0QJwo"
          curl -fsSL -o KaTan-5.21-source.zip "https://aka.doubaocdn.com/s/gKyUz2Ciz3"
          echo "a20942299f9565da3781f581f8970432f1ec6cf85a1e3edce94e93e356218889  KaTan_5.21.apk" | sha256sum -c
          echo "ec56e449127b642a215b22978b6e26fe3aec45ba65dc6eaa1a4157c299b59536  KaTan-5.21-source.zip" | sha256sum -c
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v5.21 KaTan_5.21.apk KaTan-5.21-source.zip --title "卡探 5.21 · 下载源全重排" --latest --notes-file <(printf '卡探 5.21\n\n· APK 主源改成 raw.githubusercontent.com（实测你手机能连通的那个域名）\n· 下载全失败时弹窗逐源报告 + 一键用浏览器下载\n· 源顺序：GitHub raw -> 豆包CDN -> jsDelivr -> GitHub Release -> ghfast -> Gitee\n\n校验值：\na20942299f9565da3781f581f8970432f1ec6cf85a1e3edce94e93e356218889  KaTan_5.21.apk\nec56e449127b642a215b22978b6e26fe3aec45ba65dc6eaa1a4157c299b59536  卡探-5.21-源码.zip\n')
      - name: Commit apk and feed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          mkdir -p apk
          cp KaTan_5.21.apk apk/KaTan_5.21.apk
          cat > update.json <<'JSON'
          {
            "versionCode": 74,
            "versionName": "5.21",
            "url": "https://raw.githubusercontent.com/xiaoyu4124/katan-release/main/apk/KaTan_5.21.apk",
            "urls": [
              "https://aka.doubaocdn.com/s/G5fDY0QJwo",
              "https://cdn.jsdelivr.net/gh/xiaoyu4124/katan-release@main/apk/KaTan_5.21.apk",
              "https://github.com/xiaoyu4124/katan-release/releases/download/v5.21/KaTan_5.21.apk",
              "https://ghfast.top/https://raw.githubusercontent.com/xiaoyu4124/katan-release/main/apk/KaTan_5.21.apk",
              "https://gitee.com/yu1481726037/katan-release/raw/master/apk/KaTan_5.21.apk"
            ],
            "force": false,
            "notes": "卡探 5.21\n\n· APK 主源换成 raw.githubusercontent（你手机上唯一实际连通过的域名）\n· 失败弹窗逐源报告，可一键用浏览器下载\n· 豆包CDN / jsDelivr / Release / ghfast / Gitee 依次兑底"
          }
          JSON
          python3 -m json.tool update.json > /dev/null
          git add apk/KaTan_5.21.apk update.json
          git commit -m "release: 5.21 apk + feed v74"
          git push
