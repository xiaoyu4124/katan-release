name: mirror-gitee

# 每次 main 分支有提交（APK 镜像、update.json 修改）就整仓强推到 Gitee。
# 需要仓库 Secret: GITEE_DEPLOY_KEY = 部署私钥全文；Gitee 仓库需已添加对应公钥并勾选“启用推送权限”。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-gitee
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee
        env:
          GITEE_DEPLOY_KEY: ${{ secrets.GITEE_DEPLOY_KEY }}
        run: |
          if [ -z "$GITEE_DEPLOY_KEY" ]; then
            echo '未配置 GITEE_DEPLOY_KEY，跳过 Gitee 镜像'
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$GITEE_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 gitee.com >> ~/.ssh/known_hosts 2>/dev/null
          git remote add gitee git@gitee.com:yu1481726037/katan-release.git
          git push --force gitee HEAD:refs/heads/master
