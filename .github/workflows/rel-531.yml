name: release-531
on:
  push:
    paths:
      - '.github/workflows/rel-531.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify APK
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/KaTan_5.31.apk "https://aka.doubaocdn.com/s/2zfhRPE4J1"
          echo "bfc579c1119d0165dccc0f75dfdd6923c64d3c4697c655879621053c1e648f31  /tmp/KaTan_5.31.apk" | sha256sum -c -
          mkdir -p apk
          cp /tmp/KaTan_5.31.apk apk/KaTan_5.31.apk
      - name: Write release notes
        run: |
          cat > /tmp/notes.md <<'MD'
          卡探 5.31（播放条重做）

          · 播放条改为圆角浮动卡片：#26262C 底 + 1dp 描边 + 6dp 阴影，左右留 8dp 不贴边
          · 左侧 46dp 圆角专辑封面：读取音频内嵌封面，没有封面时显示 ♪ 占位
          · 中侧两行文本：歌名 13.5sp 加粗白、歌手 · 专辑 11sp 灰，过长中间省略
          · 右侧 38dp 圆形图标按钮：暂停为双竖条，暂停后变播放三角；旁边 34dp 无底停止方块
          · 进度条改为 4dp 细线 + 8dp 圆点，已播放段为蓝色 #33A1F3，两端各显示当前/总时长
          · 通知栏文案随状态变化（正在播放 / 已暂停）
          MD
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v5.31 apk/KaTan_5.31.apk --title "卡探 5.31" --notes-file /tmp/notes.md --latest
      - name: Update update.json
        run: |
          cat > update.json <<'JSON'
          {
            "versionCode": 84,
            "versionName": "5.31",
            "url": "https://raw.githubusercontent.com/xiaoyu4124/katan-release/main/apk/KaTan_5.31.apk",
            "urls": [
              "https://aka.doubaocdn.com/s/2zfhRPE4J1",
              "https://cdn.jsdelivr.net/gh/xiaoyu4124/katan-release@main/apk/KaTan_5.31.apk",
              "https://github.com/xiaoyu4124/katan-release/releases/download/v5.31/KaTan_5.31.apk",
              "https://ghfast.top/https://raw.githubusercontent.com/xiaoyu4124/katan-release/main/apk/KaTan_5.31.apk",
              "https://gitee.com/yu1481726037/katan-release/raw/master/apk/KaTan_5.31.apk"
            ],
            "force": false,
            "notes": "卡探 5.31\n\n· 播放条改为圆角卡片 + 专辑封面 + 双行歌名\n· 圆形暂停/播控图标、细进度线、端点时间\n"
          }
          JSON
      - name: Commit artifacts
        run: |
          set -euo pipefail
          git config user.name "katan-bot"
          git config user.email "bot@users.noreply.github.com"
          git add apk/KaTan_5.31.apk update.json
          git commit -m "release: 5.31 (v84)" || echo "nothing to commit"
          git push
