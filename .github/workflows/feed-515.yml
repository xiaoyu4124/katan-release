name: feed-515

on:
  push:
    paths:
      - ".github/workflows/feed-515.yml"

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write update.json
        run: |
          cat > update.json <<'EOF'
          {
            "versionCode": 68,
            "versionName": "5.15",
            "url": "https://github.com/xiaoyu4124/katan-release/releases/download/v5.15/KaTan_5.15.apk",
            "force": false,
            "notes": "卡探 5.15\n\n· 移除四项假隐藏入口：打开隐藏区、安全柜、新建藏匿目录、新建隐藏文件夹\n· 相关代码一并删除，普通管理器能看见的一律不再提供\n· 保留 OTG 裸写四步向导（唯一真隐藏路径，不需 root）\n· 校验 ba374f7d84f27caf930c8538b75a8efdfe3670a4ec855d2e02f9bb0272101fde"
          }
          EOF
          python3 -m json.tool update.json > /dev/null
      - name: Promote release and commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit v5.15 --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add update.json
          git commit -m "feed: v68 / 5.15"
          git push
